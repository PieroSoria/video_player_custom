name: video_player_custom
description: Video player widget with Picture-in-Picture support. Native mobile and Apple backends, plus bundled Windows Media Foundation (Windows) and GStreamer (Linux) backends.
version: 0.0.1
publish_to: none

environment:
  sdk: "^3.12.0"
  flutter: ">=3.44.0"

flutter:
  plugin:
    platforms:
      android:
        package: io.flutter.plugins.videoplayer
        pluginClass: VideoPlayerCustomPlugin
        dartPluginClass: VideoPlayerCustom
      ios:
        sharedDarwinSource: true
        pluginClass: VideoPlayerCustomPlugin
        dartPluginClass: VideoPlayerCustom
      macos:
        sharedDarwinSource: true
        pluginClass: VideoPlayerCustomPlugin
        dartPluginClass: VideoPlayerCustom
      windows:
        pluginClass: VideoPlayerCustomPluginCApi
        dartPluginClass: VideoPlayerCustom
      linux:
        pluginClass: VideoPlayerCustomPlugin
        dartPluginClass: VideoPlayerCustom
      web:
        pluginClass: VideoPlayerCustomWeb
        fileName: video_player_custom_web.dart

dependencies:
  flutter:
    sdk: flutter
  video_player_platform_interface: ^6.9.0
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.0
  collection: ^1.19.0
  html: ^0.15.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: ^3.0.10
  flutter_lints: ^6.0.0
